<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dexter: Mano Robótica</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="fotos/IMG-20260122-WA0006.jpg">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
      color: #333;
    }

    header {
      background-color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      font-size: 32px;
      font-weight: bold;
      color: #004d99; /* azul ejemplo - cámbialo si quieres */
    }

    .logo img {
      height: 55px;
      margin-right: 12px;
      border-radius: 8px; /* opcional */
    }

    .nav-menu {
      list-style: none;
      display: flex;
      gap: 30px;
    }

    .nav-menu a {
      text-decoration: none;
      color: #333;
      font-size: 17px;
      font-weight: 500;
      transition: color 0.3s;
    }


    /* Footer */
    footer {
      background-color: #222;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 40px;
    }

    footer a img {
      width: 35px;
      vertical-align: middle;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        gap: 15px;
        padding: 20px;
      }

      .nav-menu {
        flex-direction: column;
        gap: 12px;
      }

      
    }
  </style>
</head>

<body>

  <header>
    <div class="navbar">
      <a href="index.html" class="logo">
        <img src="fotos/IMG-20260122-WA0006.jpg" alt="Logo Dexter">
        DEXTER
      </a>

      <ul class="nav-menu">
        <li><a href="index.html"><b>Menú Principal</b></a></li>
        <li><a href="SobreNosotros.html"><b>Sobre Nosotros</b></a></li>
        <li><a href="Contactanos.html"><b>Contáctanos</b></a></li>
        <li><a href="NuestrosProductos.html"><b>Nuestros Productos</b></a></li>
      </ul>
    </div>
    
  </header>

  <footer>

  </footer>

</body>
</html>
